<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BewerbsTimer</title>
  <meta name="description" content="Stoppuhr für den BewerbsTimer (ESP32)">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #FFFFFF; }
    @media (prefers-color-scheme: dark) { html, body { background: #000000; } }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #loading img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
  <script>
    // Chrome's install offer can come before the app has loaded: keep it for the app.
    window.__btInstall = { event: null };
    addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__btInstall.event = e;
      dispatchEvent(new Event('bt-installable'));
    });
    // Offline cache, so the installed app also starts on the ESP's Wi-Fi.
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
  <script src="bewerbstimer.js" defer></script>
</head>
<body>
  <div id="loading"><img src="icon-192.png" alt=""></div>
</body>
</html>
